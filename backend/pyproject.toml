[project]
name = "rie-backend"
version = "0.1.0"
description = "Rating Integrity Engine: System One judgments + corpus analysis -> integrity-adjusted ratings"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "orjson>=3.10",
    # System One client (Jev + laya-serve share one wire protocol)
    "httpx>=0.27",
    "aiolimiter>=1.1",
    "tenacity>=9.0",
    # Data
    "duckdb>=1.1",
    "polars>=1.8",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.14",
    # Text features
    "datasketch>=1.6",
    "sentence-transformers>=3.1",
    "faiss-cpu>=1.8",
    "lingua-language-detector>=2.0",
    # Corpus analysis
    "scikit-learn>=1.5",
    "umap-learn>=0.5.6",
    "ruptures>=1.1.9",
]

[project.optional-dependencies]
# Official TypeSafe SDK: optional, our own httpx client is the default path.
typesafe = ["typesafe-sdk"]
# Local System One model (CPU). Heavy; install only when benchmarking Laya locally.
laya = ["laya[serve]"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]
notebooks = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]  # ruff format owns line length; long prompt strings stay intact

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
