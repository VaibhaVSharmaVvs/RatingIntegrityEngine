services:
  api:
    build: ./backend
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8001
    env_file: .env
    environment:
      LAYA_BASE_URL: http://laya:8000
    ports: ["8001:8001"]
    volumes: ["./data:/app/data"]
    depends_on: [laya]

  laya:
    build:
      context: ./backend
      args: { EXTRAS: "--extra laya" }
    command: uv run laya-serve
    environment:
      LAYA_DEVICE: cpu
      LAYA_MODELS: english
    ports: ["8000:8000"]
    volumes: ["hf-cache:/root/.cache/huggingface"]

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8001
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]

volumes:
  hf-cache:
